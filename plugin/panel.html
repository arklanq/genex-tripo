<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Studio sends only its background, text and accent colours; every other tone is mixed from them. */
:root {
  --background: #0e0d0f;
  --foreground: #dee0e2;
  --accent: #3c44c4;
  --accent-foreground: #ffffff;
  --surface: color-mix(in oklab, var(--foreground) 3%, var(--background));
  --field: color-mix(in oklab, var(--foreground) 6%, var(--background));
  --hover: color-mix(in oklab, var(--foreground) 10%, var(--background));
  --line: color-mix(in oklab, var(--foreground) 9%, var(--background));
  --ink-3: color-mix(in oklab, var(--foreground) 66%, var(--background));
  --green: #7cd194;
  --orange: #efbe72;
  --red: #f08287;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
/* The card fills Studio's frame edge to edge, so the body adds no space of its own. */
body {
  padding: 0;
  background: var(--background);
  color: var(--foreground);
  font: 14px / 20px var(--sans);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.card {
  padding: 20px 24px;
  border-radius: 16px;
  background: var(--surface);
  /* Drawn inside the card: an outer ring would be clipped by the frame's edge. */
  box-shadow: inset 0 0 0 1px var(--line);
}
.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px 24px;
}
.copy { display: flex; flex: 1 1 280px; min-width: 0; flex-direction: column; gap: 4px; }
h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; line-height: 22px; }
.muted { color: var(--ink-3); text-wrap: pretty; overflow-wrap: anywhere; }
.dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--green);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 14%, transparent);
}
.dot[data-tone="warn"] { background: var(--orange); box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 14%, transparent); }
button {
  display: inline-flex;
  min-height: 36px;
  align-items: center;
  justify-content: center;
  padding: 0 14px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--foreground);
  font: 14px / 20px var(--mono);
  white-space: nowrap;
  cursor: pointer;
  transition: background-color 120ms, transform 120ms;
}
button:hover:enabled { background: var(--hover); }
button:active:enabled { transform: scale(0.96); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-foreground); }
button.primary:hover:enabled { background: color-mix(in oklab, var(--accent) 88%, var(--foreground)); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.key { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 16px; }
input {
  flex: 1 1 240px;
  min-width: 0;
  min-height: 36px;
  padding: 0 12px;
  border: 0;
  border-radius: 11px;
  background: var(--field);
  color: var(--foreground);
  font: 14px / 20px var(--mono);
}
input::placeholder { color: var(--ink-3); }
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 48px;
  margin-block-start: 20px;
  padding-block-start: 16px;
  border-block-start: 1px solid var(--line);
}
.stat { display: flex; flex-direction: column-reverse; gap: 2px; }
.stat dd { font-size: 24px; font-weight: 500; line-height: 30px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat dt { color: var(--ink-3); font-size: 13px; line-height: 18px; }
.note { margin-block-start: 12px; color: var(--ink-3); font-size: 13px; line-height: 18px; text-wrap: pretty; }
.error { margin-block-start: 12px; color: var(--red); font-size: 13px; line-height: 18px; overflow-wrap: anywhere; }
/* Until the first status arrives the card waits off screen and a spinner shows the panel is loading. */
.spinner {
  position: fixed;
  top: 48px;
  left: 50%;
  width: 20px;
  height: 20px;
  margin-left: -10px;
  border: 2px solid var(--line);
  border-top-color: var(--ink-3);
  border-radius: 999px;
  animation: spin 800ms linear infinite;
}
.card { opacity: 0; transform: translateY(8px); }
body[data-ready] .card { opacity: 1; transform: none; transition: opacity 240ms ease-out, transform 240ms ease-out; }
body[data-ready] .spinner { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
  .spinner { animation-duration: 2400ms; }
  .card { transform: none; }
}
@media (max-width: 420px) { .card { padding: 16px; } }
</style>

<div class="spinner" id="spinner" role="status" aria-label="Loading"></div>
<section class="card" aria-live="polite" aria-labelledby="title">
  <div class="row">
    <div class="copy">
      <h2 id="title"><span class="dot" id="dot" hidden></span><span id="heading">Checking…</span></h2>
      <p class="muted" id="subtitle"></p>
    </div>
    <button id="disconnect" hidden></button>
  </div>
  <div class="key" id="key-form" hidden>
    <input id="key" type="password" autocomplete="off" spellcheck="false">
    <button class="primary" id="save">Connect</button>
  </div>
  <dl class="stats" id="stats" hidden></dl>
  <p class="note" id="note"></p>
  <p class="error" id="error" role="alert"></p>
</section>

<script>// Include this in a prebuilt panel. No credential values or arbitrary IPC are exposed.
const waiting = new Map();
const contextListeners = new Set();
let seq = 0;
window.addEventListener("message", (event) => {
  if (event.source !== parent) return;
  if (event.data?.type === "studio-plugin-context-changed") {
    for (const listener of contextListeners) {
      try {
        listener();
      } catch {}
    }
    return;
  }
  if (event.data?.type !== "studio-plugin-result") return;
  const p = waiting.get(event.data.id);
  if (!p) return;
  waiting.delete(event.data.id);
  clearTimeout(p.timer);
  event.data.error ? p.reject(new Error(event.data.error)) : p.resolve(event.data.result);
});
window.studioPlugin = {
  onContextChanged(callback) {
    contextListeners.add(callback);
    return () => contextListeners.delete(callback);
  },
  call(method, name, args, options) {
    // A long setup action may extend its local wait; host validation, confirmations and
    // execution deadlines still apply. Timing out never means a remote job was cancelled.
    const timeoutMs = options?.timeoutMs ?? 60000;
    if (!Number.isInteger(timeoutMs) || timeoutMs < 1000 || timeoutMs > 1800000)
      return Promise.reject(new Error("Invalid panel wait duration"));
    const id = String(++seq);
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        waiting.delete(id);
        reject(new Error("Studio request timed out. Inspect its status before retrying."));
      }, timeoutMs);
      waiting.set(id, { resolve, reject, timer });
      parent.postMessage({ type: "studio-plugin-request", id, method, name, args }, "*");
    });
  },
};
window.addEventListener("pagehide", () => {
  for (const p of waiting.values()) {
    clearTimeout(p.timer);
    p.reject(new Error("Panel closed"));
  }
  waiting.clear();
});

/** Small framework-free SDK primitives; custom panels can also use their own framework. */
window.studioPlugin.ui = {
  text(tag, value) {
    const el = document.createElement(tag);
    el.textContent = String(value ?? "Unknown");
    return el;
  },
  status(label, value) {
    const row = document.createElement("p");
    const title = document.createElement("strong");
    title.textContent = label + ": ";
    row.append(title, document.createTextNode(String(value ?? "Unknown")));
    return row;
  },
  error(message) {
    const el = document.createElement("p");
    el.setAttribute("role", "alert");
    el.textContent = String(message);
    return el;
  },
  job(job) {
    const card = document.createElement("article");
    card.style.cssText = "border-top:1px solid #555;padding:12px 0";
    card.append(
      this.text("strong", job.operation ?? job.title ?? "Asset job"),
      this.status("Status", job.status),
      this.status("Use", job.use?.stage ?? "Not verified"),
      this.status("Charged credits", job.creditsCharged ?? "Not reported"),
      this.status("Refunded credits", job.creditsRefunded ?? "Not reported"),
    );
    if (job.generationId) card.append(this.status("Generation", job.generationId));
    for (const file of job.files ?? []) card.append(this.text("div", file));
    if (job.error) card.append(this.error(job.error));
    return card;
  },
};
</script>
<script>
const count = (value) => (typeof value === "number" ? NUMBER.format(value) : undefined);
const WORDS = {
  checking: "Checking…",
  connected: "Connected",
  connectTitle: "Connect Tripo",
  connectLine: "Paste your Tripo API key. Agents then make 3D models from your Tripo wallet, not Genex credits.",
  keyLine: (hint) => (hint ? `Tripo API key ending in ${hint}` : "Tripo API key"),
  keyHelp: "Create a key at platform.tripo3d.ai → API Keys. It starts with tsk_.",
  placeholder: "tsk_…",
  keyLabel: "Tripo API key",
  pasteFirst: "Paste your Tripo API key first.",
  disconnect: "Disconnect",
};
const STATS = (state) => [
  ["Credits", count(state.balance)],
  ["Reserved for running tasks", state.frozen > 0 ? count(state.frozen) : undefined],
];
const NOTE = () => "Tasks are paid from your Tripo wallet, not Genex credits.";

const $ = (id) => document.getElementById(id);
const call = (name, args) => window.studioPlugin.call("action", name, args ?? {});
const NUMBER = new Intl.NumberFormat();
const DATE = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
let generation = 0;
let busy = false;
// Studio announces every account action, and the refresh that follows must not wipe the action's error.
let actionError;

/** Readable label colour on the accent: dark text on a light accent, white otherwise. */
function labelOn(color) {
  const probe = document.createElement("i");
  probe.style.color = color;
  document.body.append(probe);
  const computed = getComputedStyle(probe).color;
  probe.remove();
  // Only rgb() gives 0–255 channels; for wider colour spaces keep the white label.
  if (!computed.startsWith("rgb")) return "#ffffff";
  const [r, g, b] = computed.match(/\d+(\.\d+)?/g).map(Number);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 150 ? "#0e0d0f" : "#ffffff";
}

async function applyTheme() {
  try {
    const { theme } = await window.studioPlugin.call("context");
    const root = document.documentElement.style;
    if (theme.background) root.setProperty("--background", theme.background);
    if (theme.foreground) root.setProperty("--foreground", theme.foreground);
    if (theme.accent) {
      root.setProperty("--accent", theme.accent);
      root.setProperty("--accent-foreground", labelOn(theme.accent));
    }
  } catch {}
}

function stat(label, value) {
  const wrap = document.createElement("div");
  wrap.className = "stat";
  const dt = document.createElement("dt");
  const dd = document.createElement("dd");
  dt.textContent = label;
  dd.textContent = value;
  wrap.append(dt, dd);
  return wrap;
}

function showError(error) {
  $("error").textContent = error ? String(error.message ?? error) : "";
}

function renderAccount(state) {
  const connected = !!state.connected;
  $("dot").hidden = !connected;
  $("dot").dataset.tone = state.error ? "warn" : "";
  $("heading").textContent = connected ? WORDS.connected : WORDS.connectTitle;
  $("subtitle").textContent = connected ? WORDS.keyLine(state.keyHint) : WORDS.connectLine;
  $("key-form").hidden = connected;
  $("disconnect").hidden = !connected;
  const stats = connected ? STATS(state).filter(([, value]) => value !== undefined && value !== null) : [];
  $("stats").replaceChildren(...stats.map(([label, value]) => stat(label, value)));
  $("stats").hidden = stats.length === 0;
  $("note").textContent = connected ? (state.note ?? NOTE(state)) : WORDS.keyHelp;
  showError(state.error ?? actionError);
}

// Ignore answers that arrive after a newer refresh started.
async function refresh() {
  const mine = ++generation;
  try {
    const state = await call("status");
    if (mine !== generation) return;
    renderAccount(state);
  } catch (error) {
    if (mine === generation) showError(error);
  } finally {
    if (mine === generation) reveal();
  }
}

/** Swap the spinner for the card once, after the first answer or failure. */
function reveal() {
  document.body.dataset.ready = "";
  $("spinner").removeAttribute("role");
}

async function run(button, work) {
  if (busy) return;
  busy = true;
  button.disabled = true;
  actionError = undefined;
  showError("");
  try {
    await work();
  } catch (error) {
    actionError = error;
    showError(error);
  } finally {
    busy = false;
    button.disabled = false;
  }
}

$("heading").textContent = WORDS.checking;
$("key").placeholder = WORDS.placeholder;
$("key").setAttribute("aria-label", WORDS.keyLabel);
$("disconnect").textContent = WORDS.disconnect;

$("save").onclick = () =>
  run($("save"), async () => {
    const token = $("key").value.trim();
    if (!token) throw new Error(WORDS.pasteFirst);
    await call("connect", { token });
    $("key").value = "";
    await refresh();
  });
$("key").onkeydown = (event) => {
  if (event.key === "Enter") $("save").click();
};
$("disconnect").onclick = () =>
  run($("disconnect"), async () => {
    await call("disconnect");
    await refresh();
  });

const stop = window.studioPlugin.onContextChanged(() => {
  applyTheme();
  refresh();
});
window.addEventListener("pagehide", stop);
applyTheme();
refresh();
</script>
